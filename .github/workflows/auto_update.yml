name: Busan Art Lab Auto Update

on:
  schedule:
    - cron: '0 21 * * 0'
    - cron: '0 21 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 부산 및 전국 공식 문화예술 일정·기사 자동 수집
        env:
          BUSAN_API_KEY: ${{ secrets.BUSAN_API_KEY }}
        run: python scripts/update_events.py

      - name: 변경된 일정 데이터(data/events.json) 자동 반영
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BusanArtLab Bot"
          git add data/events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update verified art events" && git push)
